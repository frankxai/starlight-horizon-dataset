name: Validate Horizon dataset

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: horizon-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 tests/test_validate.py -v

      - name: Validate entries
        run: python3 scripts/validate.py
